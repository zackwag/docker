services:
  mlbserver:
    image: tonywagner/mlbserver:latest
    container_name: mlbserver
    restart: unless-stopped
    ports:
      - 3134:9999
    volumes:
      - /docker/mlbserver/data:/mlbserver/data_directory
    environment:
      - TZ=America/New_York
      - account_username=${MLB_USERNAME}
      - account_password=${MLB_PASSWORD}
      - fav_teams=PHI
  fastchannels:
    image: ghcr.io/kineticman/fastchannels:latest
    container_name: fastchannels
    restart: unless-stopped
    ports:
      - 3135:5523
    volumes:
      - /docker/fast_channels/data:/data
  iptv-catalog:
    image: zackwag/iptv-catalog:latest
    container_name: iptv-catalog
    restart: unless-stopped
    ports:
      - 3136:3000
    volumes:
      - /docker/iptv-catalog/data:/app/data
      - /docker/iptv-catalog/epg:/app/epg-shared
    environment:
      - TZ=America/New_York
  iptv-catalog-epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: iptv-catalog-epg
    restart: unless-stopped
    environment:
      CRON_SCHEDULE: "0 */6 * * *"
      DAYS: "3"
      MAX_CONNECTIONS: "5"
    volumes:
      - /docker/iptv-catalog/epg:/epg/public
    depends_on:
      - iptv-catalog
  vlc-bridge-pbs:
      image: registry.gitlab.com/miibeez/vlc-bridge-pbs:latest
      container_name: vlc-bridge-pbs
      restart: unless-stopped
      ports:
          - 3137:7777
  prismcast:
    image: ghcr.io/hjdhjd/prismcast:latest
    container_name: prismcast
    hostname: prismcast
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - 5589:5589
      - 6080:6080
    volumes:
      - /docker/prismcast:/root/.prismcast
    environment:
      - TZ=America/New_York
      - NOVNC_PASSWORD=${PRISMCAST_NOVNC_PASSWORD}
      - HDHR_ENABLED=false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5589/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
