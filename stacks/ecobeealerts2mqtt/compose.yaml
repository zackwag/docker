services:
  ecobee-alerts-2-mqtt:
    image: zackwag/ecobeealerts2mqtt:latest
    container_name: ecobeealerts2mqtt
    restart: unless-stopped
    environment:
      - ECOBEE_API_KEY=${ECOBEE_API_KEY}
      - MQTT_HOST=192.168.4.90
      - MQTT_USERNAME=ecobeealerts2mqtt
      - MQTT_PASSWORD=${ECOBEEALERTS2MQTT_PASSWORD}
    volumes:
      - /docker/ecobeealerts2mqtt/data:/data
